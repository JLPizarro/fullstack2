<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Consorcio San Antonio Transportes</title>
  <meta name="description" content="Acceso a la plataforma interna del Consorcio San Antonio Transportes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card bg-white">
      <div class="row g-0">
        <div class="col-lg-6 auth-illustration d-none d-lg-flex">
          <img src="assets/img/hero.svg" alt="Ilustración de la flota del Consorcio San Antonio Transportes">
        </div>

        <div class="col-lg-6">
          <div class="auth-form-side">
            <img src="assets/img/logo.svg" alt="Consorcio San Antonio Transportes" height="40" class="mb-4">

            <h1 class="h3 mb-1">Bienvenido de nuevo</h1>
            <p class="text-muted-brand mb-4">Ingresa con tu cuenta de la plataforma para continuar.</p>

            <form id="form-login" novalidate>
              <div class="mb-3">
                <label for="correo" class="form-label">Correo institucional</label>
                <input
                  type="email"
                  class="form-control"
                  id="correo"
                  name="correo"
                  placeholder="nombre@duoc.cl"
                  autocomplete="email"
                  maxlength="100"
                  required
                >
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  minlength="4"
                  maxlength="20"
                  required
                >
                <div class="invalid-feedback"></div>
                <div class="form-hint mt-1">Entre 4 y 20 caracteres.</div>
              </div>

              <button type="submit" id="btn-entrar" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
              </button>
            </form>

            <p class="text-center form-hint mt-4 mb-0">
              ¿Problemas para entrar? Contacta a tu administrador de sistema.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer text-center border-0">
    © 2026 Consorcio San Antonio Transportes · Plataforma interna de gestión
  </footer>

  <script src="js/validaciones.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
