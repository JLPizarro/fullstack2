<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puntos de referencia · Consorcio San Antonio Transportes</title>
  <meta name="description" content="Catálogo de lugares físicos (terminales, bodegas, peajes, bencineras) del Consorcio San Antonio Transportes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page-title="Puntos de referencia" data-base="../../" data-pagina="puntosReferencia">

  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <main class="app-content" id="app-content">

        <section class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h4 mb-1">Puntos de referencia</h1>
            <p class="text-muted-brand mb-0">Catálogo de lugares físicos — terminal, bodega, peaje o bencinera.</p>
          </div>
          <button type="button" class="btn btn-primary text-nowrap" id="btn-nuevo-punto" data-abrir-modal="modal-punto">
            <i class="bi bi-pin-map me-1"></i>Nuevo punto
          </button>
        </section>

        <section id="lista-puntos" class="row g-3" aria-live="polite"></section>

      </main>
    </div>
  </div>

  <div class="modal fade" id="modal-punto" tabindex="-1" aria-hidden="true" style="display:none;">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="form-punto" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="punto-modal-titulo">Nuevo punto de referencia</h2>
            <button type="button" class="btn-close" data-cerrar-modal="modal-punto" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="punto-id">
            <div class="mb-3"><label for="punto-nombre" class="form-label">Nombre</label><input type="text" class="form-control" id="punto-nombre" maxlength="160" required><div class="invalid-feedback"></div></div>
            <div class="row">
              <div class="col-6 mb-3"><label for="punto-abreviacion" class="form-label">Abreviación</label><input type="text" class="form-control" id="punto-abreviacion" maxlength="12" required><div class="invalid-feedback"></div></div>
              <div class="col-6 mb-3"><label for="punto-tipo" class="form-label">Tipo</label><select class="form-select" id="punto-tipo" required><option value="" selected disabled>Selecciona un tipo</option></select><div class="invalid-feedback"></div></div>
            </div>
            <div id="campo-punto-montoPeaje" class="mb-3 d-none"><label for="punto-montoPeaje" class="form-label">Monto del peaje (CLP)</label><input type="number" min="0" class="form-control" id="punto-montoPeaje"><div class="invalid-feedback"></div></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" data-cerrar-modal="modal-punto">Cancelar</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../../js/datos.js"></script>
  <script src="../../js/validaciones.js"></script>
  <script src="../../js/render.js"></script>
  <script src="../../js/modal.js"></script>
  <script src="../../js/entidades.js"></script>
  <script src="../../js/pagina-generica.js"></script>
  <script src="../../js/layout.js"></script>
</body>
</html>
