<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos · Consorcio San Antonio Transportes</title>
  <meta name="description" content="Gastos asociados a viajes del Consorcio San Antonio Transportes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page-title="Gastos" data-base="../../" data-pagina="gastos">

  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <main class="app-content" id="app-content">

        <section class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h4 mb-1">Gastos</h1>
            <p class="text-muted-brand mb-0">Solo lectura — un gasto siempre nace asociado a un viaje puntual: regístralo desde la pestaña "Gastos" de la ficha de ese viaje, en Operación → Viajes.</p>
          </div>
          <div class="search-bar" style="min-width:220px;">
            <i class="bi bi-search"></i>
            <input type="search" id="buscador" class="form-control" placeholder="Buscar por categoría, proveedor..." autocomplete="off" aria-label="Buscar gasto">
          </div>
        </section>

        <div class="table-responsive">
          <table class="table align-middle bg-white rounded-4 overflow-hidden">
            <thead class="table-light"><tr><th>Viaje</th><th>Categoría</th><th>Proveedor</th><th>Fecha</th><th class="text-end">Monto</th></tr></thead>
            <tbody id="lista-gastos"></tbody>
            <tfoot>
              <tr class="table-light"><td colspan="4" class="text-end fw-semibold">Total</td><td class="text-end fw-semibold" id="gastos-total">$0</td></tr>
            </tfoot>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="../../js/datos.js"></script>
  <script src="../../js/render.js"></script>
  <script src="../../js/entidades.js"></script>
  <script src="../../js/pagina-generica.js"></script>
  <script src="../../js/layout.js"></script>
</body>
</html>
