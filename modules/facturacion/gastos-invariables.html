<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos invariables · Consorcio San Antonio Transportes</title>
  <meta name="description" content="Catálogo de costos fijos reutilizables del Consorcio San Antonio Transportes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page-title="Gastos invariables" data-base="../../" data-pagina="gastosInvariables">

  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <main class="app-content" id="app-content">

        <section class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h4 mb-1">Gastos invariables</h1>
            <p class="text-muted-brand mb-0">Costos fijos reutilizables (peajes fijos, seguros...) aplicables a una o varias rutas.</p>
          </div>
          <button type="button" class="btn btn-primary text-nowrap" id="btn-nuevo-gasto-invariable" data-abrir-modal="modal-gasto-invariable">
            <i class="bi bi-receipt-cutoff me-1"></i>Nuevo gasto invariable
          </button>
        </section>

        <section id="lista-gastos-invariables" class="row g-3" aria-live="polite"></section>

      </main>
    </div>
  </div>

  <div class="modal fade" id="modal-gasto-invariable" tabindex="-1" aria-hidden="true" style="display:none;">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="form-gasto-invariable" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="gasto-invariable-modal-titulo">Nuevo gasto invariable</h2>
            <button type="button" class="btn-close" data-cerrar-modal="modal-gasto-invariable" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="gasto-invariable-id">
            <div class="mb-3"><label for="gasto-invariable-nombre" class="form-label">Nombre</label><input type="text" class="form-control" id="gasto-invariable-nombre" maxlength="160" required><div class="invalid-feedback"></div></div>
            <div class="row">
              <div class="col-6 mb-3"><label for="gasto-invariable-categoria" class="form-label">Categoría</label><select class="form-select" id="gasto-invariable-categoria" required><option value="" selected disabled>Selecciona una categoría</option></select><div class="invalid-feedback"></div></div>
              <div class="col-6 mb-3"><label for="gasto-invariable-monto" class="form-label">Monto (CLP)</label><input type="number" min="0" class="form-control" id="gasto-invariable-monto" required><div class="invalid-feedback"></div></div>
            </div>
            <div class="mb-3"><label for="gasto-invariable-proveedor" class="form-label">Proveedor</label><input type="text" class="form-control" id="gasto-invariable-proveedor" maxlength="160" required><div class="invalid-feedback"></div></div>
            <div class="mb-1"><label class="form-label d-block">Rutas donde aplica</label><div id="gasto-invariable-rutas"></div></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" data-cerrar-modal="modal-gasto-invariable">Cancelar</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../../js/datos.js"></script>
  <script src="../../js/validaciones.js"></script>
  <script src="../../js/render.js"></script>
  <script src="../../js/modal.js"></script>
  <script src="../../js/entidades.js"></script>
  <script src="../../js/pagina-generica.js"></script>
  <script src="../../js/layout.js"></script>
</body>
</html>
