<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios · Consorcio San Antonio Transportes</title>
  <meta name="description" content="Cuentas de la plataforma del Consorcio San Antonio Transportes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page-title="Usuarios" data-base="../../" data-pagina="usuarios">

  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <main class="app-content" id="app-content">

        <section class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h4 mb-1">Usuarios</h1>
            <p class="text-muted-brand mb-0">Cuentas de la plataforma interna.</p>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <div class="search-bar" style="min-width:220px;">
              <i class="bi bi-search"></i>
              <input type="search" id="buscador" class="form-control" placeholder="Buscar por nombre, correo..." autocomplete="off" aria-label="Buscar usuario">
            </div>
            <button type="button" class="btn btn-primary text-nowrap" id="btn-nuevo-usuario"><i class="bi bi-person-gear me-1"></i>Añadir usuario</button>
          </div>
        </section>

        <div class="table-responsive">
          <table class="table align-middle bg-white rounded-4 overflow-hidden">
            <thead class="table-light"><tr><th>RUN</th><th>Nombre</th><th>Correo</th><th>Rol</th></tr></thead>
            <tbody id="lista-usuarios"></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal: alta/edición de usuario (ficha + formulario fundidos) -->
  <div class="modal fade" id="modal-usuario" tabindex="-1" aria-hidden="true" style="display:none;">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <form id="form-usuario" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="modal-usuario-titulo">Añadir usuario</h2>
            <button type="button" class="btn-close" data-cerrar-modal="modal-usuario" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <p class="form-section-title">Datos personales</p>
            <div class="row">
              <div class="col-md-6 mb-3"><label for="u-run" class="form-label">RUN</label><input type="text" class="form-control" id="u-run" placeholder="19011022K" maxlength="9" required><div class="invalid-feedback"></div></div>
              <div class="col-md-6 mb-3"><label for="u-correo" class="form-label">Correo</label><input type="email" class="form-control" id="u-correo" placeholder="nombre@duoc.cl" required><div class="invalid-feedback"></div></div>
              <div class="col-md-6 mb-3"><label for="u-nombre" class="form-label">Nombre</label><input type="text" class="form-control" id="u-nombre" required><div class="invalid-feedback"></div></div>
              <div class="col-md-6 mb-3"><label for="u-apellidos" class="form-label">Apellidos</label><input type="text" class="form-control" id="u-apellidos" required><div class="invalid-feedback"></div></div>
            </div>

            <p class="form-section-title mt-2">Ubicación</p>
            <div class="row">
              <div class="col-md-6 mb-3"><label for="u-region" class="form-label">Región</label><select class="form-select" id="u-region" required><option value="" selected disabled>Selecciona una región</option></select><div class="invalid-feedback"></div></div>
              <div class="col-md-6 mb-3"><label for="u-comuna" class="form-label">Comuna</label><select class="form-select" id="u-comuna" required><option value="" selected disabled>Selecciona una región primero</option></select><div class="invalid-feedback"></div></div>
            </div>

            <p class="form-section-title mt-2">Acceso a la plataforma</p>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="u-rol" class="form-label">Rol</label>
                <select class="form-select" id="u-rol" required><option value="" selected disabled>Selecciona un rol</option><option value="Administrador">Administrador</option><option value="Operador">Operador</option></select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4 mb-3"><label for="u-password" class="form-label">Contraseña</label><input type="password" class="form-control" id="u-password"><div class="invalid-feedback"></div><div class="form-hint mt-1" id="u-pista-password">Entre 6 y 20 caracteres.</div></div>
              <div class="col-md-4 mb-3"><label for="u-password2" class="form-label">Confirmar contraseña</label><input type="password" class="form-control" id="u-password2"><div class="invalid-feedback"></div></div>
            </div>

            <div id="u-seccion-permisos" class="conditional-section mb-1 d-none">
              <p class="form-section-title mb-2">Permisos por módulo</p>
              <p class="small text-muted-brand mb-2">Solo aplica a Operador — Administrador tiene acceso total por definición.</p>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-primary" data-cerrar-modal="modal-usuario">Cancelar</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../../js/datos.js"></script>
  <script src="../../js/validaciones.js"></script>
  <script src="../../js/render.js"></script>
  <script src="../../js/modal.js"></script>
  <script src="../../js/entidades.js"></script>
  <script src="../../js/pagina-generica.js"></script>
  <script src="../../js/layout.js"></script>
</body>
</html>
