<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Ilustración de flota de transporte">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7f5"/>
      <stop offset="100%" stop-color="#eff3fa"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="520" height="420" rx="24" fill="url(#skyGrad)"/>
  <circle cx="430" cy="90" r="46" fill="#f6f7f8" opacity="0.9"/>
  <circle cx="430" cy="90" r="46" fill="#3bc48d" opacity="0.15"/>
  <rect x="0" y="300" width="520" height="120" fill="#dfe3ee"/>
  <rect x="0" y="330" width="520" height="10" fill="#c1ceeb"/>
  <g stroke="#ffffff" stroke-width="6" stroke-dasharray="26 22">
    <line x1="0" y1="335" x2="520" y2="335"/>
  </g>

  <!-- Camión principal -->
  <g transform="translate(70,190)">
    <rect x="0" y="40" width="210" height="80" rx="10" fill="#3969d0"/>
    <rect x="14" y="54" width="182" height="24" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="210" y="60" width="70" height="60" rx="8" fill="#20489d"/>
    <rect x="222" y="70" width="34" height="24" rx="3" fill="#c1ceeb"/>
    <circle cx="48" cy="132" r="20" fill="#1e232f"/>
    <circle cx="48" cy="132" r="8" fill="#8d94a5"/>
    <circle cx="234" cy="132" r="20" fill="#1e232f"/>
    <circle cx="234" cy="132" r="8" fill="#8d94a5"/>
    <rect x="212" y="66" width="6" height="48" fill="#3969d0"/>
  </g>

  <!-- Camión secundario, más chico y detrás -->
  <g transform="translate(320,235) scale(0.62)">
    <rect x="0" y="40" width="210" height="80" rx="10" fill="#3bc48d"/>
    <rect x="14" y="54" width="182" height="24" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="210" y="60" width="70" height="60" rx="8" fill="#279166"/>
    <rect x="222" y="70" width="34" height="24" rx="3" fill="#dbf0e8"/>
    <circle cx="48" cy="132" r="20" fill="#1e232f"/>
    <circle cx="234" cy="132" r="20" fill="#1e232f"/>
  </g>
</svg>
